[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-contract-rag"
version = "0.1.0"
description = "Production-grade grounded RAG for smart-contract audit reports, running fully on local models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sergi (eLSeR17)" }]
keywords = ["rag", "llm", "smart-contracts", "audit", "grounding", "rag-eval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dependencies are mirrored in requirements.txt; keeping them here as well so
# `pip install -e .` (or `pip install .`) works for a venv-based install.
dependencies = [
    "pydantic>=2.5,<3.0",
    "httpx>=0.24,<1.0",
    "requests>=2.28,<3.0",
    "numpy>=1.24,<2.0",
    "chromadb>=0.4.22,<1.0",
    "sentence-transformers>=2.2,<4.0",
    "PyMuPDF>=1.23,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
]

[project.scripts]
smart-contract-rag-query = "smart_contract_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
