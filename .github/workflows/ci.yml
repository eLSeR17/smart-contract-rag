name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight core deps
        run: |
          python -m pip install --upgrade pip
          # Install only the deps the deterministic tests need (no Ollama,
          # no ChromaDB-side serving, no network). PyMuPDF/sentence-transformers
          # are exercised only by the optional live path, not by unit tests.
          pip install pytest numpy httpx requests fastapi

      - name: Run deterministic unit tests
        run: |
          pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.7

      - name: Lint with ruff
        run: ruff check src tests scripts

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          # Audit the pinned requirement set directly (no install, no heavy
          # downloads) — fails the build on any known advisory.
          # SECURITY EXCEPTION (documented, 2026-09-10): chromadb pinned 0.6.3 —
          # PYSEC-2026-3813/3814/3815 have NO upstream fix (last_affected = latest
          # release 1.5.9) and target ChromaDB's SERVER auth/RBAC/tenant API. This
          # project embeds chromadb as an in-process PersistentClient (no exposed
          # chroma server endpoints), so those vectors are unreachable. Ignored at
          # the gate only: pip-audit still audits the rest of the tree, and the
          # exception is re-evaluated on each new chromadb release.
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
