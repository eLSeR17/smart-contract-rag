name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight core deps
        run: |
          python -m pip install --upgrade pip
          # Install only the deps the deterministic tests need (no Ollama,
          # no ChromaDB-side serving, no network). PyMuPDF/sentence-transformers
          # are exercised only by the optional live path, not by unit tests.
          pip install pytest numpy httpx requests

      - name: Run deterministic unit tests
        run: |
          pytest tests/ -v --tb=short
